name: Backend Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fullstack_demo_test
          POSTGRES_USER: archer
          POSTGRES_PASSWORD: 123456
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U archer -d fullstack_demo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile backend
        run: python -m compileall app

      - name: Run backend tests
        run: python -m pytest
        env:
          DATABASE_URL: postgresql+psycopg://archer:123456@localhost:5432/fullstack_demo_test
          TEST_DATABASE_URL: postgresql+psycopg://archer:123456@localhost:5432/fullstack_demo_test
